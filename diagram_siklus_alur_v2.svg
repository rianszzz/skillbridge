    <circle cx="210" cy="68" r="11" fill="#2563eb"/>
    <text x="210" y="72" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <text x="227" y="72" fill="#0f172a" font-size="11.5" font-weight="700">Multi-Bukti Portofolio</text>
