  <!-- Title Header Banner -->
  <rect x="30" y="20" width="1040" height="60" rx="8" fill="url(#gradHeader2)" filter="url(#shadow2)"/>
  <text x="50" y="45" fill="#f8fafc" font-size="16.5" font-weight="700" letter-spacing="0.5">GAMBAR 2 (REVISI): DIAGRAM ALUR SIKLUS TERTUTUP END-TO-END (CLOSED-LOOP PIPELINE)</text>
  <text x="50" y="65" fill="#94a3b8" font-size="12">Integrasi Siklus Belajar Pelamar, Bursa Lowongan Industri, Evaluasi HR ATS, &amp; Umpan Balik Real-Time</text>
  <rect x="910" y="35" width="140" height="28" rx="14" fill="#10b981"/>
  <text x="980" y="53" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">REALTIME SYNC ACTIVE</text>

