    <text x="23" y="108" fill="#475569" font-size="10">• Tentukan Peran</text>
    <text x="23" y="123" fill="#475569" font-size="10">• Syarat &amp; Privasi</text>
    <text x="23" y="145" fill="#2563eb" font-size="9.5" font-weight="600">Akun: Kandidat</text>

